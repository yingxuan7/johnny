<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hey Johnny! 👀</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff9e8;
            color: #222;
            overflow-x: hidden;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            padding: 30px;
        }

        /* Background doodles */

        .doodle {
            position: absolute;
            font-size: 45px;
            user-select: none;
        }

        .doodle.one {
            top: 10%;
            left: 8%;
            transform: rotate(-15deg);
        }

        .doodle.two {
            top: 18%;
            right: 10%;
            transform: rotate(12deg);
        }

        .doodle.three {
            bottom: 15%;
            left: 12%;
            transform: rotate(10deg);
        }

        .doodle.four {
            bottom: 12%;
            right: 12%;
            transform: rotate(-12deg);
        }

        .content {
            max-width: 700px;
            position: relative;
            z-index: 2;
        }

        .small-text {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 58px;
            line-height: 1.05;
            margin: 10px 0;
            font-weight: 900;
        }

        .hand {
            font-size: 70px;
            display: inline-block;
            animation: wave 1.2s infinite;
        }

        .subtitle {
            font-size: 22px;
            margin-top: 25px;
            line-height: 1.5;
        }

        .button {
            display: inline-block;
            margin-top: 35px;
            padding: 16px 32px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .button:hover {
            transform: scale(1.08) rotate(-2deg);
        }

        .note {
            margin-top: 20px;
            font-size: 14px;
            color: #777;
        }

        @keyframes wave {
            0%, 100% {
                transform: rotate(0deg);
            }

            25% {
                transform: rotate(18deg);
            }

            75% {
                transform: rotate(-12deg);
            }
        }

        @media (max-width: 600px) {

            h1 {
                font-size: 42px;
            }

            .subtitle {
                font-size: 18px;
            }

            .doodle {
                font-size: 32px;
            }

            .hand {
                font-size: 55px;
            }
        }
    </style>
</head>

<body>

    <section class="hero">

        <!-- Little playful decorations -->
        <div class="doodle one">⭐</div>
        <div class="doodle two">💥</div>
        <div class="doodle three">😂</div>
        <div class="doodle four">✏️</div>

        <div class="content">

            <div class="small-text">
                🚨 IMPORTANT ANNOUNCEMENT 🚨
            </div>

            <div class="hand">
                ✋
            </div>

            <h1>
                HEY JOHNNY!<br>
                WAIT!
            </h1>

            <p class="subtitle">
                You thought you could just leave<br>
                without saying goodbye? 👀
            </p>

            <a href="#next" class="button">
                What is this? 👀
            </a>

            <div class="note">
                Don't worry... it's not a work-related message. 😂
            </div>

        </div>

    </section>


    <section id="next" style="
        min-height: 70vh;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 40px;
    ">

        <div>
            <h2 style="font-size: 38px;">
                Okay... you caught us. 😌
            </h2>

            <p style="font-size: 20px; line-height: 1.6;">
                We made a little something for you.
                <br>
                But that's all you're getting for now... 👀
            </p>

            <p style="font-size: 45px;">
                💌 📸 🎵
            </p>
        </div>

    </section>

</body>
</html>
